steps:
  # Instalar dependências
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['ci']
    dir: '.'
  
  # Executar linting
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'lint']
    dir: '.'
  
  # Executar testes unitários
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'test']
    dir: '.'
    env:
      - 'NODE_ENV=test'
  
  # Executar testes e2e
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'test:e2e']
    dir: '.'
    env:
      - 'NODE_ENV=test'
  
  # Build da aplicação
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: '.'
  
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$test-ci-cd-474501/task-manager:$COMMIT_SHA',
      '-t', 'gcr.io/$test-ci-cd-474501/task-manager:latest',
      '.'
    ]
  
  # Push das imagens
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$test-ci-cd-474501/task-manager:$COMMIT_SHA']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$test-ci-cd-474501/task-manager:latest']
  
  # Deploy para Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'task-manager'
    - '--image'
    - 'gcr.io/$test-ci-cd-474501/task-manager:$COMMIT_SHA'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--port'
    - '3000'
    - '--memory'
    - '1Gi'
    - '--cpu'
    - '1'
    - '--min-instances'
    - '0'
    - '--max-instances'
    - '10'
    - '--set-env-vars'
    - 'NODE_ENV=production,PORT=3000'

# Configurações do build
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout do build
timeout: '1800s'